<path class="dash" d="M40 308H1160" stroke="#D94A38" stroke-opacity=".65"/>
<rect class="scan" x="40" y="82" width="90" height="226" fill="url(#scanGrad)"/>
<circle class="signal" cx="1138" cy="65" r="4" fill="#FF5A3D"/>
