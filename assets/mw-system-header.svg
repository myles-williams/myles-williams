<svg width="1200" height="390" viewBox="0 0 1200 390" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
  .mono{font-family:'Courier New',monospace}
  .sans{font-family:Arial,Helvetica,sans-serif}
  .signal{animation:pulse 2.8s ease-in-out infinite}
  .scan{animation:scan 8s linear infinite}
  .dash{stroke-dasharray:7 10;animation:dash 12s linear infinite}
  @keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
  @keyframes scan{0%{transform:translateX(-1120px);opacity:0}8%{opacity:.55}92%{opacity:.55}100%{transform:translateX(1120px);opacity:0}}
  @keyframes dash{to{stroke-dashoffset:-170}}
  @media (prefers-reduced-motion: reduce){.signal,.scan,.dash{animation:none}}
</style>
<rect width="1200" height="390" rx="8" fill="#07090B"/>
<path d="M40 47H1160M40 343H1160" stroke="#31383D"/>
