<text x="68.05" y="111.203" fill="#6F7473" font-weight="400" textLength="520.81" lengthAdjust="spacing">INTELLIGENCE PROPOSES.</text>
<text x="68.05" y="159.078" fill="#F2F4F2" font-weight="500" textLength="689.94" lengthAdjust="spacing">DETERMINISTIC SYSTEMS GOVERN.</text>
<text x="68.05" y="206.953" fill="#D9DCDA" font-weight="400" textLength="380.75" lengthAdjust="spacing">EVIDENCE PROVES.</text>
